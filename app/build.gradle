plugins {
    id 'com.android.application'
}

android {
    namespace = 'ru.akt.app'
    compileSdk = 34

    defaultConfig {
        applicationId = 'ru.akt.app'
        minSdk = 29          // Android 10 и новее
        targetSdk = 34
        versionCode = 1
        versionName = '1.0'
    }

    // Постоянный ключ подписи: каждая новая сборка ставится поверх старой и записи сохраняются
    signingConfigs {
        debug {
            storeFile = file('akt.keystore')
            storePassword = 'aktrabot'
            keyAlias = 'akt'
            keyPassword = 'aktrabot'
        }
    }

    buildTypes {
        release { minifyEnabled = false; signingConfig = signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
